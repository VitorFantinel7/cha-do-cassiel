<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="presentes">
<header class="site-header" id="site-header"></header>
<main>
<section class="page-hero">
  <img src="assets/img/teddy.png" alt="">
  <h1>Presentes</h1>
  <p>Escolha um mimo para fazer parte da chegada do Cassiel.</p>
  <a class="crumb" href="index.html">← Voltar ao início</a>
</section>
<section class="section">
  <div class="pills" id="pills" role="tablist" aria-label="Filtrar por categoria"></div>
  <div class="product-grid gift-grid" id="giftGrid"></div>
  <div style="display:flex;justify-content:center;margin-top:32px">
    <a class="btn btn-secondary" href="#" data-external="listaCompleta">Ver lista completa na loja
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
    </a>
  </div>
</section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<a class="fab" id="whatsappFab" href="#" target="_blank" rel="noopener noreferrer" aria-label="Confirmar presença pelo WhatsApp">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-1 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.7.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
  Confirmar presença
</a>
<script src="assets/app.js"></script>
<script>
function initPage(){
  const cats = ['Todos', ...GIFT_CATEGORIES.map(c=>c.key)];
  const fromUrl = new URLSearchParams(location.search).get('cat');
  let active = cats.includes(fromUrl) ? fromUrl : 'Todos';
  function draw(){
    document.getElementById('pills').innerHTML = cats.map(c =>
      `<button role="tab" class="pill ${c===active?'active':''}" aria-selected="${c===active}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
    const list = active==='Todos' ? GIFTS : GIFTS.filter(g=>g.category===active);
    document.getElementById('giftGrid').innerHTML = list.map(giftCard).join('');
    observeReveal();
  }
  document.getElementById('pills').addEventListener('click', e => {
    const p = e.target.closest('[data-cat]'); if(!p) return;
    active = p.dataset.cat; history.replaceState(null,'', active==='Todos' ? 'presentes.html' : 'presentes.html?cat='+encodeURIComponent(active)); draw();
  });
  draw(); onRerender(draw);
}
</script>
</body>
</html>
